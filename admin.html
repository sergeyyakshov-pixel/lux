<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUX — Админ-панель</title><link rel="stylesheet" href="style.css">
<style>
.admin{max-width:760px;margin:7vh auto;padding:24px}.admin .glass{margin:16px 0}

<header class="top"><a class="logo" href="index.html">LUX<span>✦</span></a><a href="index.html">← На сайт</a></header>

<label>Пароль<input id="password" type="password" autocomplete="current-password" required></label>
